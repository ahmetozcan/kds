[project]
name = "tbm-rop"
version = "0.1.0"
description = "Kalman-denoised stacked ensembles and TabPFN for TBM rate-of-penetration prediction on the Bahce-Nurdag tunnel dataset"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["TBM", "rate of penetration", "machine learning", "Kalman filter", "TabPFN", "stacking"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "optuna>=3.6",
    "tabpfn>=7.0.1,<8",  # 8.x requires a Prior Labs API token for model weights
    "torch>=2.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
tbm-rop = "tbm_rop.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
